services:
  - type: web
    name: kometa-crm-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kometa-crm-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://your-frontend.vercel.app
      - key: SEED_ADMIN_EMAIL
        value: yan993870@gmail.com
      - key: SEED_ADMIN_PASSWORD
        value: admin
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Токен бота напоминаний от @BotFather. Задаётся в панели Render,
      # в репозиторий не попадает. Пока не задан — бот не запускается,
      # остальной сервер работает как обычно.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: kometa_agent_bot
      # Хранилище файлов Архива — Cloudflare R2. Ключи задаются в панели
      # Render и в репозиторий не попадают. Пока не заданы, вкладка Архива
      # работает на чтение, а загрузка отвечает понятной ошибкой.
      # Имя бакета не секрет, поэтому лежит здесь.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: kometa-archive

      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: kometa-crm-db
    plan: free
